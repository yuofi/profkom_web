map $uri $profkom_static_asset_cache {
    default "no-cache";
    "~^/assets/[^/]+-[A-Za-z0-9_-]{8,}[.][A-Za-z0-9]+$" "private, max-age=31536000, immutable";
}

server {
    listen  443 ssl;
    server_name  profcom-cmc.ru;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Server-local locations (routes of other services on this host) live outside git in
    # ./nginx-extra next to docker-compose.yml; an empty folder is fine.
    include /etc/nginx/extra/*.conf;

    # Compression is enabled only in static locations, never for API/private files.
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        gzip on;
        add_header Cache-Control "no-cache";
    }

    # A missing build asset must not fall back to a cacheable HTML shell.
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        gzip on;
        add_header Cache-Control $profkom_static_asset_cache;
    }

    # PDF.js module worker is a trusted build asset and needs an explicit JS MIME.
    location ~ ^/assets/.*\.mjs$ {
        root /usr/share/nginx/html;
        default_type application/javascript;
        try_files $uri =404;
        gzip on;
        add_header Cache-Control $profkom_static_asset_cache;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The backend checks access to a file on every request and then answers with
        # X-Accel-Redirect: nginx fetches the bytes in /_storage (decision 23, АВ-9).
        proxy_set_header X-File-Delivery accel;

        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Internal only: the object behind the short signed link the backend sent in
    # X-Storage-Url. The link itself never reaches the browser.
    location = /_storage {
        internal;
        # Docker's DNS: the storage host comes from a variable.
        resolver 127.0.0.11 ipv6=off valid=60s;
        set $storage_url $upstream_http_x_storage_url;
        proxy_pass $storage_url;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        # The signature is the only credential; nothing of the visitor goes on.
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # Type, file name and caching are those the backend set.
        proxy_hide_header Content-Type;
        proxy_hide_header Content-Disposition;
        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-meta-sha256;
        proxy_hide_header x-amz-storage-class;
        # The storage must not set the transport policy of the site.
        proxy_hide_header Strict-Transport-Security;
        proxy_intercept_errors on;
        error_page 400 403 404 = @storage_failed;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy sandbox always;
    }

    location @storage_failed {
        return 502;
    }
}
