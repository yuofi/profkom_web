services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      # Loopback only: the site reaches the backend through nginx of the frontend; a direct
      # request with X-File-Delivery would show a 60-second storage signature (step 8).
      - "127.0.0.1:${BACKEND_PORT}:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:443"
    volumes:
      # Certificates: CERTS_DIR in .env next to this file (./certs by default).
      - ${CERTS_DIR:-./certs}:/etc/nginx/ssl
      # Server-local nginx blocks outside git (see frontend/nginx.conf).
      - ./nginx-extra:/etc/nginx/extra:ro
    depends_on:
      - backend
      